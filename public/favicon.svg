<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="12" fill="#050505"/>
  <!-- Broken wall -->
  <rect x="15" y="20" width="30" height="15" rx="1" fill="#1e293b" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <rect x="50" y="20" width="35" height="15" rx="1" fill="#1e293b" stroke="#22d3ee" stroke-width="1" opacity="0.7"/>
  <rect x="15" y="40" width="20" height="15" rx="1" fill="#1e293b" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
  <!-- Gap in wall (the break) -->
  <rect x="65" y="40" width="20" height="15" rx="1" fill="#1e293b" stroke="#22d3ee" stroke-width="1" opacity="0.4"/>
  <rect x="15" y="60" width="25" height="15" rx="1" fill="#1e293b" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
  <rect x="60" y="60" width="25" height="15" rx="1" fill="#1e293b" stroke="#22d3ee" stroke-width="1" opacity="0.3"/>
  <!-- Signal wave through the gap -->
  <path d="M40 47 Q50 35 60 47" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M35 47 Q50 30 65 47" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Accent dot -->
  <circle cx="50" cy="47" r="3" fill="#22d3ee"/>
</svg>
