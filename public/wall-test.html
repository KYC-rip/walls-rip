<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>walls.rip - Smash the Wall</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><text y='30' font-size='28'>🔨</text></svg>") 8 28, crosshair;
    user-select: none;
    -webkit-user-select: none;
  }

  #wall-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    background: #12100e;
    padding: 2px;
  }

  .wall-row {
    display: flex;
    justify-content: center;
    margin-bottom: 3px;
  }

  .wall-row:last-child { margin-bottom: 0; }

  /* Staggered brickwork: odd rows shift */
  .wall-row.offset { transform: translateX(30px); }

  .brick {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 20px;
    margin: 0 1.5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #9e9585;
    text-transform: uppercase;
    white-space: nowrap;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 40%),
      linear-gradient(225deg, rgba(0,0,0,0.2) 0%, transparent 40%),
      linear-gradient(to bottom, #3d3832 0%, #302c27 35%, #282420 100%);
    border: 1px solid #1a1815;
    border-top-color: #504a42;
    border-left-color: #444038;
    border-right-color: #1e1b17;
    border-bottom-color: #151210;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.07),
      inset 0 -2px 0 rgba(0,0,0,0.25),
      inset 2px 0 0 rgba(255,255,255,0.02),
      inset -2px 0 0 rgba(0,0,0,0.1),
      0 2px 6px rgba(0,0,0,0.5);
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    cursor: inherit;
    min-width: 60px;
    text-align: center;
  }

  /* Concrete texture overlay */
  .brick::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(
        90deg, transparent, transparent 6px,
        rgba(0,0,0,0.04) 6px, rgba(0,0,0,0.04) 7px
      ),
      repeating-linear-gradient(
        0deg, transparent, transparent 4px,
        rgba(0,0,0,0.03) 4px, rgba(0,0,0,0.03) 5px
      );
    pointer-events: none;
    opacity: 0.7;
  }

  /* Subtle noise texture via radial dots */
  .brick::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.15) 1px, transparent 1px),
      radial-gradient(circle at 60% 70%, rgba(0,0,0,0.1) 1px, transparent 1px),
      radial-gradient(circle at 80% 20%, rgba(255,255,255,0.03) 1px, transparent 1px),
      radial-gradient(circle at 40% 80%, rgba(0,0,0,0.12) 1px, transparent 1px);
    background-size: 12px 10px, 15px 13px, 11px 9px, 14px 12px;
    pointer-events: none;
    opacity: 0.5;
  }

  .brick:hover {
    color: #c4b8a4;
    background:
      linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 40%),
      linear-gradient(225deg, rgba(0,0,0,0.15) 0%, transparent 40%),
      linear-gradient(to bottom, #443e36 0%, #363028 35%, #2c2822 100%);
  }

  /* Crack overlay rendered via SVG */
  .brick .crack-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    opacity: 0;
    z-index: 2;
  }

  .brick.cracking .crack-svg {
    opacity: 1;
    animation: crackAppear 0.2s ease-out forwards;
  }

  .brick.cracking {
    animation: brickCrack 0.3s ease-out forwards;
  }

  @keyframes crackAppear {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
  }

  @keyframes brickCrack {
    0% { transform: scale(1); filter: brightness(1); }
    30% { transform: scale(1.03) rotate(0.5deg); filter: brightness(1.4); }
    100% { transform: scale(0.97) rotate(-0.3deg); filter: brightness(0.6); }
  }

  .fragment {
    position: fixed;
    z-index: 100;
    pointer-events: none;
    will-change: transform, opacity;
    font-family: 'JetBrains Mono', monospace;
  }

  #hint {
    position: fixed;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: #00ff41;
    letter-spacing: 4px;
    text-transform: uppercase;
    z-index: 20;
    animation: pulse 1.8s ease-in-out infinite;
    text-shadow: 0 0 10px rgba(0,255,65,0.5), 0 0 40px rgba(0,255,65,0.15);
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.04); }
  }

  #tagline {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.5s ease-in;
  }

  #tagline.visible {
    opacity: 1;
    pointer-events: auto;
  }

  #tagline h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(26px, 5.5vw, 68px);
    font-weight: 800;
    color: #00ff41;
    line-height: 1.3;
    text-shadow:
      0 0 30px rgba(0,255,65,0.6),
      0 0 80px rgba(0,255,65,0.25),
      0 0 120px rgba(0,255,65,0.1);
    letter-spacing: 3px;
  }

  #tagline p {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(11px, 1.8vw, 16px);
    color: #00ff41aa;
    margin-top: 28px;
    letter-spacing: 8px;
    text-transform: uppercase;
  }

  #restart-btn {
    display: inline-block;
    margin-top: 48px;
    padding: 12px 36px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #00ff41;
    background: transparent;
    border: 1px solid #00ff4140;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }

  #restart-btn:hover {
    background: #00ff4112;
    border-color: #00ff41;
    box-shadow: 0 0 30px rgba(0,255,65,0.2);
  }

  #dust-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 98;
    pointer-events: none;
  }

  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    z-index: 500;
    pointer-events: none;
    transition: opacity 0.08s ease-out;
  }

  #flash.active {
    opacity: 0.15;
  }

  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
    z-index: 1;
    pointer-events: none;
  }

  #scan-line {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent, transparent 2px,
      rgba(0,255,65,0.012) 2px, rgba(0,255,65,0.012) 4px
    );
    z-index: 2;
    pointer-events: none;
  }

  /* Ambient floating particles */
  .ambient-particle {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    animation: ambientFloat linear infinite;
  }

  @keyframes ambientFloat {
    0% { opacity: 0; transform: translateY(0) translateX(0); }
    10% { opacity: 0.3; }
    90% { opacity: 0.3; }
    100% { opacity: 0; transform: translateY(-120px) translateX(30px); }
  }

  @media (max-width: 768px) {
    .brick {
      padding: 10px 12px;
      font-size: 8px;
      letter-spacing: 0.8px;
      min-width: 40px;
    }
    .wall-row.offset { transform: translateX(20px); }
    #hint { font-size: 11px; bottom: 5%; }
    #wall-container { padding: 1px; }
    .wall-row { margin-bottom: 2px; }
    .brick { margin: 0 1px; }
  }

  @media (max-width: 480px) {
    .brick {
      padding: 8px 8px;
      font-size: 7px;
      letter-spacing: 0.5px;
      min-width: 30px;
    }
    .wall-row.offset { transform: translateX(15px); }
  }
</style>
</head>
<body>

<div id="vignette"></div>
<div id="scan-line"></div>
<div id="flash"></div>
<canvas id="dust-canvas"></canvas>

<div id="wall-container"></div>

<div id="hint">[ click to smash ]</div>

<div id="tagline">
  <h1>Break walls.<br>Reclaim privacy.</h1>
  <p>walls.rip</p>
  <button id="restart-btn" onclick="restart()">Smash again</button>
</div>

<script>
const WORDS = [
  'KYC', 'IDENTITY', 'SURVEILLANCE', 'COMPLIANCE', 'DATA HARVEST',
  'PHONE VERIFY', 'SELFIE CHECK', 'ADDRESS PROOF', 'SSN', 'FACIAL RECOGNITION',
  'PASSPORT', 'BANK STATEMENT', 'UTILITY BILL', 'PROOF OF ADDRESS', 'BIOMETRIC',
  'FINGERPRINT', 'GOVERNMENT ID', 'TAX RETURN', 'CREDIT CHECK', 'SOCIAL SECURITY',
  'VIDEO CALL', 'LIVENESS CHECK', 'AML', 'SANCTIONS', 'WATCHLIST',
  'PII COLLECTION', 'TRACKING', 'PROFILING', 'METADATA', 'DRAGNET',
  'MASS SURVEILLANCE', 'DATA BROKER', 'DOXXING', 'BLACKLIST', 'CENSORSHIP'
];

// Wall layout: define rows with specific word indices for a brick-like stagger
// We will build rows dynamically to fill the screen width

let smashed = false;
let bricks = [];
let fragments = [];
let dustCanvas, dustCtx;
let dustParticles = [];
let animFrame;
let ambientParticles = [];

// Generate crack SVG for a brick
function makeCrackSVG() {
  const patterns = [
    // Pattern 1: center burst
    `<line x1="50%" y1="50%" x2="15%" y2="10%" stroke="#1a1510" stroke-width="1.5"/>
     <line x1="50%" y1="50%" x2="85%" y2="20%" stroke="#1a1510" stroke-width="1"/>
     <line x1="50%" y1="50%" x2="20%" y2="90%" stroke="#1a1510" stroke-width="1.2"/>
     <line x1="50%" y1="50%" x2="80%" y2="85%" stroke="#1a1510" stroke-width="1"/>
     <line x1="50%" y1="50%" x2="5%" y2="50%" stroke="#1a1510" stroke-width="0.8"/>
     <line x1="50%" y1="50%" x2="95%" y2="55%" stroke="#1a1510" stroke-width="0.8"/>`,
    // Pattern 2: diagonal split
    `<line x1="10%" y1="0%" x2="90%" y2="100%" stroke="#1a1510" stroke-width="1.5"/>
     <line x1="30%" y1="0%" x2="70%" y2="100%" stroke="#1a1510" stroke-width="0.8"/>
     <line x1="50%" y1="50%" x2="0%" y2="60%" stroke="#1a1510" stroke-width="1"/>
     <line x1="50%" y1="50%" x2="100%" y2="40%" stroke="#1a1510" stroke-width="1"/>`,
    // Pattern 3: spider web
    `<line x1="40%" y1="40%" x2="0%" y2="0%" stroke="#1a1510" stroke-width="1.2"/>
     <line x1="40%" y1="40%" x2="100%" y2="0%" stroke="#1a1510" stroke-width="1"/>
     <line x1="40%" y1="40%" x2="0%" y2="100%" stroke="#1a1510" stroke-width="0.8"/>
     <line x1="40%" y1="40%" x2="100%" y2="100%" stroke="#1a1510" stroke-width="1.3"/>
     <line x1="40%" y1="40%" x2="50%" y2="0%" stroke="#1a1510" stroke-width="0.6"/>
     <line x1="40%" y1="40%" x2="40%" y2="100%" stroke="#1a1510" stroke-width="0.7"/>`
  ];
  const idx = Math.floor(Math.random() * patterns.length);
  return `<svg class="crack-svg" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${patterns[idx]}</svg>`;
}

function buildWall() {
  const container = document.getElementById('wall-container');
  container.innerHTML = '';

  // Determine how many bricks per row based on viewport
  const vw = window.innerWidth;
  let bricksPerRow, numRows;

  if (vw <= 480) {
    bricksPerRow = 4;
    numRows = 9;
  } else if (vw <= 768) {
    bricksPerRow = 5;
    numRows = 8;
  } else if (vw <= 1200) {
    bricksPerRow = 7;
    numRows = 8;
  } else {
    bricksPerRow = 8;
    numRows = 8;
  }

  // Filter words for small screens (max ~12 chars on mobile)
  const maxWordLen = vw <= 480 ? 14 : vw <= 768 ? 18 : 999;
  const filteredWords = WORDS.filter(w => w.length <= maxWordLen);

  // Create a pool of shuffled words (repeating to fill wall)
  let wordPool = [];
  while (wordPool.length < bricksPerRow * numRows + numRows) {
    const shuffled = [...filteredWords].sort(() => Math.random() - 0.5);
    wordPool = wordPool.concat(shuffled);
  }

  bricks = [];
  let wordIdx = 0;

  for (let row = 0; row < numRows; row++) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'wall-row' + (row % 2 === 1 ? ' offset' : '');

    const count = bricksPerRow;

    for (let col = 0; col < count; col++) {
      const brick = document.createElement('div');
      brick.className = 'brick';
      brick.textContent = wordPool[wordIdx % wordPool.length];
      brick.innerHTML = wordPool[wordIdx % wordPool.length] + makeCrackSVG();
      brick.dataset.row = row;
      brick.dataset.col = col;
      brick.dataset.word = wordPool[wordIdx % wordPool.length];
      rowDiv.appendChild(brick);
      bricks.push(brick);
      wordIdx++;
    }

    container.appendChild(rowDiv);
  }
}

function spawnAmbientParticles() {
  // Remove old ambient particles
  document.querySelectorAll('.ambient-particle').forEach(p => p.remove());

  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'ambient-particle';
    p.style.width = (1 + Math.random() * 2) + 'px';
    p.style.height = p.style.width;
    p.style.background = `rgba(${150 + Math.random()*50}, ${140 + Math.random()*40}, ${120 + Math.random()*30}, 0.3)`;
    p.style.left = (10 + Math.random() * 80) + 'vw';
    p.style.top = (20 + Math.random() * 60) + 'vh';
    p.style.animationDuration = (5 + Math.random() * 10) + 's';
    p.style.animationDelay = (Math.random() * 8) + 's';
    document.body.appendChild(p);
  }
}

function init() {
  smashed = false;
  fragments = [];
  dustParticles = [];

  const container = document.getElementById('wall-container');
  container.style.display = '';
  container.style.transition = '';
  container.style.opacity = '1';
  container.style.pointerEvents = 'auto';

  document.getElementById('tagline').classList.remove('visible');
  const hint = document.getElementById('hint');
  hint.style.display = 'block';
  hint.style.opacity = '1';
  hint.style.transition = '';

  // Remove leftover fragments
  document.querySelectorAll('.fragment').forEach(f => f.remove());

  dustCanvas = document.getElementById('dust-canvas');
  dustCtx = dustCanvas.getContext('2d');
  dustCanvas.width = window.innerWidth;
  dustCanvas.height = window.innerHeight;

  buildWall();
  spawnAmbientParticles();

  container.addEventListener('click', handleSmash, { once: true });
  container.addEventListener('touchstart', handleSmash, { once: true, passive: true });

  if (animFrame) cancelAnimationFrame(animFrame);
  animateDust();
}

function handleSmash(e) {
  if (smashed) return;
  smashed = true;

  // Remove ambient particles
  document.querySelectorAll('.ambient-particle').forEach(p => p.remove());

  // Hide hint
  const hint = document.getElementById('hint');
  hint.style.transition = 'opacity 0.2s';
  hint.style.opacity = '0';
  setTimeout(() => { hint.style.display = 'none'; }, 200);

  // Determine click/touch point
  let cx, cy;
  if (e.touches) {
    cx = e.touches[0].clientX;
    cy = e.touches[0].clientY;
  } else {
    cx = e.clientX;
    cy = e.clientY;
  }

  // Flash
  const flash = document.getElementById('flash');
  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 120);

  // Screen shake - more intense
  screenShake(12, 500);

  // Calculate max distance for wave timing
  let maxBrickDist = 0;
  const brickCenters = bricks.map(brick => {
    const rect = brick.getBoundingClientRect();
    const bx = rect.left + rect.width / 2;
    const by = rect.top + rect.height / 2;
    const dist = Math.sqrt((bx - cx) ** 2 + (by - cy) ** 2);
    if (dist > maxBrickDist) maxBrickDist = dist;
    return { brick, bx, by, dist, rect };
  });

  // Shatter bricks with wave delay
  brickCenters.forEach(({ brick, bx, by, dist, rect }) => {
    const normalDist = dist / (maxBrickDist || 1);
    const delay = normalDist * 2000; // Wave spreads over 2s

    // Crack phase
    setTimeout(() => {
      brick.classList.add('cracking');
      spawnDustAt(bx, by, 4);
    }, delay * 0.5);

    // Shatter phase
    setTimeout(() => {
      shatterBrick(brick, cx, cy, dist, maxBrickDist);
    }, delay);
  });

  // Secondary shake at wave midpoint
  setTimeout(() => screenShake(6, 300), 800);

  // Fade out wall container background
  setTimeout(() => {
    document.getElementById('wall-container').style.transition = 'opacity 0.8s ease-out';
    document.getElementById('wall-container').style.opacity = '0';
  }, 2200);

  // Show tagline after wall is fully destroyed
  setTimeout(() => {
    document.getElementById('wall-container').style.display = 'none';
    document.getElementById('tagline').classList.add('visible');
  }, 3500);
}

function shatterBrick(brick, clickX, clickY, dist, maxDist) {
  const rect = brick.getBoundingClientRect();
  const bx = rect.left + rect.width / 2;
  const by = rect.top + rect.height / 2;

  // Direction away from click
  const angle = Math.atan2(by - clickY, bx - clickX);
  const force = 1.2 - (dist / (maxDist || 1)) * 0.6;

  // Create 5-8 fragments per brick
  const fragCount = 5 + Math.floor(Math.random() * 4);
  const word = brick.dataset.word || '';

  for (let i = 0; i < fragCount; i++) {
    const frag = document.createElement('div');
    frag.className = 'fragment';

    const w = rect.width * (0.15 + Math.random() * 0.45);
    const h = rect.height * (0.25 + Math.random() * 0.55);

    const startX = rect.left + Math.random() * (rect.width - w);
    const startY = rect.top + Math.random() * (rect.height - h);

    // Fragment visual: concrete chunk
    const shade = 30 + Math.floor(Math.random() * 25);
    const warmth = Math.floor(Math.random() * 8);
    frag.style.width = w + 'px';
    frag.style.height = h + 'px';
    frag.style.left = startX + 'px';
    frag.style.top = startY + 'px';
    frag.style.background = `linear-gradient(${Math.random()*360}deg,
      rgb(${shade + warmth + 10}, ${shade + warmth + 5}, ${shade}) 0%,
      rgb(${shade + warmth}, ${shade + warmth - 3}, ${shade - 5}) 100%)`;
    frag.style.border = '1px solid rgba(0,0,0,0.3)';
    frag.style.boxShadow = 'inset 0 1px 0 rgba(255,255,255,0.05)';

    // Show partial word text on some fragments
    if (i < 2 && word.length > 1) {
      const start = Math.floor(Math.random() * Math.max(1, word.length - 2));
      const sub = word.substring(start, start + 1 + Math.floor(Math.random() * 3));
      frag.textContent = sub;
      frag.style.fontSize = '8px';
      frag.style.color = `rgba(${130 + Math.random()*40}, ${120 + Math.random()*30}, ${100 + Math.random()*20}, 0.6)`;
      frag.style.display = 'flex';
      frag.style.alignItems = 'center';
      frag.style.justifyContent = 'center';
      frag.style.overflow = 'hidden';
      frag.style.letterSpacing = '1px';
      frag.style.fontWeight = '700';
    }

    document.body.appendChild(frag);

    // Physics: slower, more dramatic
    const spreadAngle = angle + (Math.random() - 0.5) * 2.2;
    const speed = (1.5 + Math.random() * 5) * force;
    const vx = Math.cos(spreadAngle) * speed + (Math.random() - 0.5) * 3;
    const vy = Math.sin(spreadAngle) * speed - (1.5 + Math.random() * 3);
    const vr = (Math.random() - 0.5) * 12;

    fragments.push({
      el: frag,
      x: startX,
      y: startY,
      vx,
      vy,
      rotation: Math.random() * 20 - 10,
      vr,
      opacity: 1,
      life: 1,
      origLeft: startX,
      origTop: startY
    });
  }

  // Dust burst
  spawnDustAt(bx, by, 20);

  // Hide original brick
  brick.style.visibility = 'hidden';
}

function spawnDustAt(x, y, count) {
  for (let i = 0; i < count; i++) {
    const speed = 1 + Math.random() * 4;
    const angle = Math.random() * Math.PI * 2;
    dustParticles.push({
      x: x + (Math.random() - 0.5) * 40,
      y: y + (Math.random() - 0.5) * 40,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - Math.random() * 2,
      size: 1 + Math.random() * 5,
      opacity: 0.3 + Math.random() * 0.5,
      life: 1,
      decay: 0.008 + Math.random() * 0.018,
      r: 150 + Math.floor(Math.random() * 50),
      g: 140 + Math.floor(Math.random() * 40),
      b: 120 + Math.floor(Math.random() * 30)
    });
  }
}

function screenShake(intensity, duration) {
  const start = performance.now();
  function shake(now) {
    const elapsed = now - start;
    if (elapsed > duration) {
      document.body.style.transform = '';
      return;
    }
    const decay = 1 - elapsed / duration;
    const freq = Math.sin(elapsed * 0.05) * Math.cos(elapsed * 0.03);
    const dx = (Math.random() - 0.5 + freq * 0.3) * intensity * decay * 2;
    const dy = (Math.random() - 0.5) * intensity * decay * 2;
    document.body.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(shake);
  }
  requestAnimationFrame(shake);
}

const GRAVITY = 0.18;

function animateDust() {
  dustCtx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);

  // Update fragments
  for (let i = fragments.length - 1; i >= 0; i--) {
    const f = fragments[i];
    f.vy += GRAVITY;
    f.x += f.vx;
    f.y += f.vy;
    f.rotation += f.vr;
    f.vx *= 0.98;
    f.vr *= 0.99;

    // Floor collision: bounce and settle
    const floorY = window.innerHeight - 10;
    if (f.y > floorY && !f.settled) {
      f.y = floorY;
      f.vy = -Math.abs(f.vy) * 0.25; // Weak bounce
      f.vx *= 0.5;
      f.vr *= 0.3;
      if (Math.abs(f.vy) < 1) {
        f.settled = true;
        f.vy = 0;
        f.vx = 0;
        f.vr = 0;
      }
    }

    // Gradual fade: settled fragments fade out slowly for rubble effect
    if (f.settled) {
      f.settledTime = (f.settledTime || 0) + 1;
      if (f.settledTime > 120) { // Linger ~2s then start fading
        f.opacity -= 0.008;
      }
    } else {
      f.life -= 0.004;
      if (f.y > window.innerHeight + 100) {
        f.opacity -= 0.03;
      } else if (f.life < 0.2) {
        f.opacity -= 0.008;
      }
    }

    if (f.opacity <= 0 || f.life <= 0) {
      f.el.remove();
      fragments.splice(i, 1);
      continue;
    }

    const dx = f.x - f.origLeft;
    const dy = f.y - f.origTop;
    f.el.style.transform = `translate(${dx}px, ${dy}px) rotate(${f.rotation}deg)`;
    f.el.style.opacity = Math.max(0, f.opacity);
  }

  // Update dust particles on canvas
  for (let i = dustParticles.length - 1; i >= 0; i--) {
    const p = dustParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.015;
    p.vx *= 0.992;
    p.life -= p.decay;

    if (p.life <= 0) {
      dustParticles.splice(i, 1);
      continue;
    }

    const alpha = p.life * p.opacity;
    const radius = p.size * (0.5 + p.life * 0.5);

    // Draw soft glow dust
    dustCtx.beginPath();
    dustCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    dustCtx.fillStyle = `rgba(${p.r},${p.g},${p.b},${alpha})`;
    dustCtx.fill();

    // Outer glow for larger particles
    if (radius > 2) {
      dustCtx.beginPath();
      dustCtx.arc(p.x, p.y, radius * 2, 0, Math.PI * 2);
      dustCtx.fillStyle = `rgba(${p.r},${p.g},${p.b},${alpha * 0.15})`;
      dustCtx.fill();
    }
  }

  animFrame = requestAnimationFrame(animateDust);
}

function restart() {
  document.querySelectorAll('.fragment').forEach(f => f.remove());
  if (animFrame) cancelAnimationFrame(animFrame);
  init();
}

window.addEventListener('resize', () => {
  if (dustCanvas) {
    dustCanvas.width = window.innerWidth;
    dustCanvas.height = window.innerHeight;
  }
});

init();
</script>

</body>
</html>
